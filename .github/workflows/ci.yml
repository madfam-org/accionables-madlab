name: CI/CD Pipeline

# Quality gate for the monorepo. Every job below runs on both push-to-main
# and pull-requests so that lint/type-check/test drift on main is caught
# immediately (the previous monolithic "lint" job let TypeScript errors slip
# through via continue-on-error, which is why we ended up with a 711-error
# baseline before #15).
#
# Workspace coverage is intentionally explicit: server and client each get
# their own lint, type-check, and test jobs so a single failure surfaces as
# a single named status check that branch protection can require.

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ─── apps/server ──────────────────────────────────────────────────────────
  server-lint:
    name: Server Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: ESLint (apps/server)
        run: npm run lint --workspace=apps/server

  server-type-check:
    name: Server Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: tsc --noEmit (apps/server)
        run: npm run type-check --workspace=apps/server

  server-test:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Vitest (apps/server)
        run: npm run test --workspace=apps/server

  # ─── apps/client ──────────────────────────────────────────────────────────
  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: ESLint (apps/client)
        run: npm run lint --workspace=apps/client

  client-type-check:
    name: Client Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: tsc --noEmit (apps/client)
        run: npm run type-check --workspace=apps/client

  client-test:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Vitest (apps/client)
        run: npm run test --workspace=apps/client -- --run
      - name: Generate coverage report
        run: npm run test:coverage --workspace=apps/client -- --run
        continue-on-error: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: apps/client/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # ─── E2E + Build ──────────────────────────────────────────────────────────
  # Spins up a real Postgres + API server before running Playwright so the
  # client talks to the actual stack instead of mocks. Auth uses the dev-mock
  # token (`dev-token-mock-user`) which the server only honors when
  # NODE_ENV=development — see apps/server/src/middleware/auth.ts.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Service container is preferred over `docker compose up` here:
      #   - GHA manages lifecycle, healthcheck, and log capture for free.
      #   - One DB process, no inter-container DNS, no compose-file drift.
      #   - Faster cold start than building the server image from compose.
      # We still need the server itself in the host job (not as a service)
      # because it's TS sources we want to run via tsx — building a Docker
      # image on every CI run would dominate the wall-clock budget.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: madlab
          POSTGRES_PASSWORD: madlab
          POSTGRES_DB: madlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madlab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Server reads these. NODE_ENV=development gates the dev-mock token bypass
      # in apps/server/src/middleware/auth.ts and also makes Janua optional in
      # apps/server/src/config/env.ts (assertJanuaConfiguredIfProduction is a no-op).
      NODE_ENV: development
      DATABASE_URL: postgresql://madlab:madlab@localhost:5432/madlab
      PORT: '3001'
      HOST: '127.0.0.1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Schema first, then seed. db:push is non-interactive in CI because
      # there's no existing schema to diff against — drizzle-kit just emits
      # the create statements.
      - name: Apply database schema (drizzle push)
        run: npm run db:push --workspace=apps/server
        env:
          # drizzle-kit reads DATABASE_URL directly from the env block above.
          DATABASE_URL: postgresql://madlab:madlab@localhost:5432/madlab

      - name: Seed database
        run: npm run seed --workspace=apps/server
        env:
          DATABASE_URL: postgresql://madlab:madlab@localhost:5432/madlab

      # Start the API server in the background. We use tsx (the dev script)
      # rather than building first to keep the job fast — the server isn't
      # under test here, only as a dependency for the client.
      - name: Start API server (background)
        run: |
          npm run dev --workspace=apps/server > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://madlab:madlab@localhost:5432/madlab
          PORT: '3001'
          HOST: '127.0.0.1'

      - name: Wait for /api/health
        run: |
          # Poll for up to ~60s. The server's own waitForDatabase has a 30s
          # budget, so we give it that plus a margin for tsx startup.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then
              echo "API server is up after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API server failed to come up. Server log:"
          cat /tmp/server.log || true
          exit 1

      # Playwright's existing webServer config starts vite (the client).
      # We deliberately do NOT start the API via webServer because:
      #   - The API needs the DB up first; webServer can't express that ordering.
      #   - Two webServer entries would race the seed step.
      # Local dev (`npm run test:e2e` outside CI) still works unchanged because
      # webServer's `reuseExistingServer: !process.env.CI` lets the developer
      # run their own server, and falls back to `npm run dev` (vite) otherwise.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Print server log on failure
        if: failure()
        run: |
          echo "=== /tmp/server.log ==="
          cat /tmp/server.log || true

      - name: Stop API server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 30

      - name: Upload server log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-server-log
          path: /tmp/server.log
          retention-days: 7

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      [
        server-lint,
        server-type-check,
        server-test,
        client-lint,
        client-type-check,
        client-test,
      ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build all workspaces
        run: npm run build
      - name: Check build size
        run: |
          echo "Client build size:" && du -sh apps/client/dist/ || true
          echo "Server build size:" && du -sh apps/server/dist/ || true
      - name: Upload client build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: apps/client/dist/
          retention-days: 7

  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/
      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
        continue-on-error: true

  deploy-production:
    name: Deploy to Production (Vercel)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true
